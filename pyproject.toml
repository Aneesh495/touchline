[project]
name = "touchline"
version = "0.1.0"
description = "Spatial football intelligence and competition forecasting"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Touchline" }]
dependencies = [
    "numpy>=1.26,<2.3",
    "polars>=1.0",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "requests>=2.31",
]

[project.optional-dependencies]
# Learned models. Kept optional so the domain core installs on hosts
# without a compatible torch wheel; model code degrades to a clear error.
learn = ["torch>=2.2"]
boost = ["lightgbm>=4.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "hypothesis>=6.100",
]

[project.scripts]
touchline = "touchline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/touchline"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501", "UP042"]  # keep (str, Enum) uniform across the codebase

[tool.mypy]
python_version = "3.11"
packages = ["touchline"]
mypy_path = "src"
warn_unused_ignores = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
