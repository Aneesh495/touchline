name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Create venv and install
        run: |
          uv venv --python 3.12 .venv
          uv pip install -e ".[dev]"

      - name: Lint
        run: .venv/bin/ruff check src tests

      - name: Unit and correctness tests (no torch)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          .venv/bin/python -m pytest tests/ -p no:cacheprovider \
            --ignore=tests/test_neural.py \
            --ignore=tests/test_campaign.py -q

      - name: Integration path (demo)
        run: .venv/bin/python -m touchline.cli demo --n-sims 500

      - name: Verifier negative controls
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          .venv/bin/python -m pytest tests/test_verifier_controls.py \
            -p no:cacheprovider -q

  neural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - name: Install with torch
        run: |
          uv venv --python 3.12 .venv
          uv pip install -e ".[dev,learn]"
      - name: Neural and campaign tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          .venv/bin/python -m pytest tests/test_neural.py tests/test_campaign.py \
            -p no:cacheprovider -q
